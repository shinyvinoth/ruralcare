<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ShinyMart - Login</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f4f8f4;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        .login-container {

            background: white;

            width: 400px;

            padding: 40px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.12);

            text-align: center;
        }


        .logo {

            font-size: 50px;

            margin-bottom: 5px;
        }


        h1 {

            color: #2e7d32;

            margin: 5px 0;

            font-size: 32px;
        }


        .subtitle {

            color: #666;

            margin-bottom: 30px;
        }


        .input-box {

            width: 100%;

            padding: 13px;

            margin: 10px 0;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }


        .input-box:focus {

            border-color: #2e7d32;
        }


        .login-btn {

            width: 100%;

            padding: 13px;

            margin-top: 20px;

            background: #2e7d32;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 16px;

            cursor: pointer;
        }


        .login-btn:hover {

            background: #1b5e20;
        }


        .demo {

            margin-top: 18px;

            padding: 10px;

            background: #f1f8e9;

            border-radius: 8px;

            font-size: 13px;

            color: #33691e;
        }


        .info {

            margin-top: 20px;

            font-size: 13px;

            color: #777;

            line-height: 1.5;
        }


        @media (max-width: 500px) {

            .login-container {

                width: 90%;

                padding: 30px;
            }
        }

    </style>

</head>


<body>


    <div class="login-container">


        <div class="logo">
            🌿
        </div>


        <h1>
            ShinyMart
        </h1>


        <p class="subtitle">
            Essential needs, closer to you
        </p>


        <form
            action="/login"
            method="post">


            <input
                type="text"
                name="username"
                class="input-box"
                placeholder="Enter Username"
                required
            >


            <input
                type="password"
                name="password"
                class="input-box"
                placeholder="Enter Password"
                required
            >


            <button
                type="submit"
                class="login-btn">

                🔐 Login

            </button>


        </form>


        <div class="demo">

            <b>Demo Login</b>

            <br>

            Any username and password can be used.

        </div>


        <p class="info">

            Access essential healthcare and
            daily-use products easily.

        </p>


    </div>


</body>

</html>
